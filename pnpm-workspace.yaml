# Not a workspace: since pnpm 11 this file is where pnpm reads its settings,
# even for a single package.

# pnpm reads its settings here since v11.

# strictDepBuilds is on by default since pnpm 11: a dependency with a build
# script that is neither allowed nor denied fails the install.
allowBuilds:
  # Its postinstall downloads a Chromium. training-kit installs it on demand,
  # only for the PDF exports, unless TRAINING_KIT_CHROME points at one already
  # on the machine.
  playwright-chromium: false
  # Pulled in by the peer dependencies (Astro, Slidev): the platform binaries
  # ship as optional dependencies, neither needs its script.
  esbuild: false
  sharp: false

# Security fixes Trivy reports in transitive dependencies, until their parents
# move on (see .trivyignore.yaml for what cannot be forced yet).
overrides:
  # monaco-editor (Slidev) pins it exactly; same major.
  dompurify: ^3.4.18
  # @modelcontextprotocol/node (Slidev) accepts ^2.1.3 already.
  '@hono/node-server': ^2.1.11
  # Declared by pptxgenjs (Slidev's PPTX export) but never imported by its build.
  image-size: ^2.0.3
